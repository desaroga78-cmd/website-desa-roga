<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Panel Admin ONLINE FINAL - Desa Roga</title>
<style>*{box-sizing:border-box}body{font-family:'Segoe UI',Arial;background:#f0f4f0;margin:0}header{background:linear-gradient(135deg,#126b36,#218c4b);color:white;padding:18px;text-align:center;position:sticky;top:0;z-index:20}.container{width:96%;max-width:1200px;margin:12px auto}.card{background:white;padding:14px;border-radius:10px;box-shadow:0 3px 10px rgba(0,0,0,0.08);margin-bottom:12px}table{width:100%;border-collapse:collapse;font-size:12px}th,td{border:1px solid #d9d9d9;padding:8px;text-align:left;vertical-align:top}th{background:#126b36;color:white} .btn{border:0;border-radius:6px;padding:6px 10px;font-size:11px;font-weight:bold;cursor:pointer;color:white;margin:2px} .hijau{background:#126b36}.biru{background:#0d6efd}.merah{background:#dc3545}.kuning{background:#ffc107;color:#333} img.foto{width:70px;border-radius:6px;cursor:pointer;border:1px solid #ddd} .filter{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px} .filter input,.filter select{padding:8px;border:1px solid #ccc;border-radius:6px;font-size:12px} .badge{padding:3px 8px;border-radius:12px;font-size:10px;font-weight:bold} .badge-baru{background:#ffeb3b;color:#333}.badge-proses{background:#90caf9}.badge-selesai{background:#a5d6a7}</style></head><body>
<header><h2 style="margin:0">PANEL ADMIN SURAT - ONLINE REALTIME <span style="background:#00e676;color:#003300;padding:2px 8px;border-radius:10px;font-size:10px">● LIVE</span></h2><p style="margin:5px 0 0;font-size:11px">Koleksi: surat_dari_rumah | Project: website-desa-roga</p><div style="margin-top:10px"><button class="btn hijau" onclick="loadOnline()">🔄 REFRESH ONLINE</button><button class="btn biru" onclick="exportCSV()">📥 EXPORT CSV</button><span id="jml" style="background:white;color:#126b36;padding:5px 10px;border-radius:15px;font-weight:bold;margin-left:8px">0 Data</span></div><div class="filter" style="margin-top:12px;justify-content:center"><input id="cari" placeholder="🔍 Cari NIK / Nama / Dusun" oninput="filterTabel()" style="min-width:200px"><select id="filterStatus" onchange="filterTabel()"><option value="">Semua Status</option><option>BARU</option><option>DIPROSES</option><option>SELESAI</option></select><select id="filterDusun" onchange="filterTabel()"><option value="">Semua Dusun</option><option>AEGOMO</option><option>DEKOTONGA</option><option>ROGA</option><option>TOBA</option></select></div></header>
<div class="container"><div id="tabelWrap" class="card" style="overflow:auto;max-height:75vh"><table id="tabelSurat"><thead><tr><th>No</th><th>Waktu</th><th>NIK / Nama</th><th>Dusun</th><th>Jenis Surat</th><th>Keperluan</th><th>Foto</th><th>Status</th><th>Aksi</th></tr></thead><tbody id="tbody"></tbody></table></div></div>
<script>function escapeHtml(s){if(!s)return"";return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}let allData=[];function renderTabel(data){const tbody=document.getElementById('tbody');tbody.innerHTML="";data.forEach((x,i)=>{const tr=document.createElement('tr');tr.innerHTML=`<td>${i+1}</td><td>${escapeHtml(x.waktu||'')}</td><td><b>${escapeHtml(x.nik||'')}</b><br>${escapeHtml(x.nama||'')}</td><td>${escapeHtml(x.dusun||'')}</td><td>${escapeHtml(x.jenis||'')}</td><td style="max-width:200px;white-space:pre-wrap">${escapeHtml(x.keperluan||'')}</td><td>${x.foto?`<img src="${x.foto}" class="foto" onclick="window.open(this.src,'_blank')">`:'-'}</td><td><span class="badge ${x.status=='BARU'?'badge-baru':x.status=='DIPROSES'?'badge-proses':'badge-selesai'}">${escapeHtml(x.status||'')}</span></td><td><button class="btn hijau" onclick="setStatus('${x.id}','SELESAI')">✅ Selesai</button><button class="btn biru" onclick="setStatus('${x.id}','DIPROSES')">⏳ Proses</button><button class="btn merah" onclick="hapusData('${x.id}')">🗑️</button></td>`;tbody.appendChild(tr);});}function filterTabel(){const q=document.getElementById('cari').value.toLowerCase();const fs=document.getElementById('filterStatus').value;const fd=document.getElementById('filterDusun').value;const filtered=allData.filter(x=>{const matchQ=!q||(x.nik||'').toLowerCase().includes(q)||(x.nama||'').toLowerCase().includes(q)||(x.dusun||'').toLowerCase().includes(q);const matchS=!fs||x.status==fs;const matchD=!fd||x.dusun==fd;return matchQ&&matchS&&matchD;});renderTabel(filtered);}function exportCSV(){let csv="No,Waktu,NIK,Nama,Dusun,Jenis,Keperluan,Status\n";allData.forEach((x,i)=>{csv+=`${i+1},"${x.waktu||''}","${x.nik||''}","${(x.nama||'').replace(/"/g,'')}","${x.dusun||''}","${x.jenis||''}","${(x.keperluan||'').replace(/"/g,'')}","${x.status||''}"\n`;});const blob=new Blob([csv],{type:'text/csv'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='surat_dari_rumah_'+new Date().toISOString().slice(0,10)+'.csv';a.click();}</script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, getDocs, updateDoc, deleteDoc, doc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const firebaseConfig = {apiKey: "AIzaSyCAubppaW0xLMKxZIjIeA_LbubuYd9STvU",authDomain: "website-desa-roga.firebaseapp.com",databaseURL: "https://website-desa-roga-default-rtdb.asia-southeast1.firebasedatabase.app",projectId: "website-desa-roga",storageBucket: "website-desa-roga.firebasestorage.app",messagingSenderId: "747779814475",appId: "1:747779814475:web:a110a0de147c39748289ce",measurementId: "G-VET1MZFTY2"};
const app = initializeApp(firebaseConfig); const db = getFirestore(app);
window.loadOnline=async()=>{document.getElementById('jml').innerText="⏳ Loading...";try{const q=query(collection(db,"surat_dari_rumah"),orderBy("createdAt","desc"));const snap=await getDocs(q);allData=[];snap.forEach(d=>{allData.push({id:d.id,...d.data()});});document.getElementById('jml').innerText=allData.length+" Data ONLINE";filterTabel();}catch(e){alert("Gagal load: "+e.message);document.getElementById('jml').innerText="Error";}};window.setStatus=async(id,st)=>{try{await updateDoc(doc(db,"surat_dari_rumah",id),{status:st});loadOnline();}catch(e){alert(e.message);}};window.hapusData=async(id)=>{if(!confirm("Hapus data ini?"))return;try{await deleteDoc(doc(db,"surat_dari_rumah",id));loadOnline();}catch(e){alert(e.message);}};loadOnline();
</script></body></html>
