<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grafik 2026 - Desa Roga - OFFLINE 1 LAYAR</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;font-family:Segoe UI,Arial;background:#f1f3e8;overflow:hidden}
.header{height:56px;background:linear-gradient(90deg,#0e5a32,#1e8a4d);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 14px}
.btn{font-size:11px;font-weight:800;padding:7px 14px;border-radius:999px;text-decoration:none;border:none}
.btn-white{background:#fff;color:#0e5a32}.btn-ghost{background:rgba(255,255,255,.18);color:#fff;border:1px solid rgba(255,255,255,.3)}
.top{height:70px;display:grid;grid-template-columns:repeat(5,1fr);gap:8px;padding:8px 10px}
.stat{background:#fff;border-radius:14px;padding:8px 10px;box-shadow:0 2px 8px rgba(0,0,0,.06);border-top:3px solid #0e5a32}
.stat .val{font-size:22px;font-weight:900;color:#0e5a32}
.main{height:calc(100vh - 56px - 70px - 22px);display:grid;grid-template-columns:1.15fr .75fr 1fr;gap:8px;padding:0 10px 8px 10px}
.card{background:#fff;border-radius:16px;padding:10px 12px;box-shadow:0 2px 10px rgba(0,0,0,.06);display:flex;flex-direction:column}
.card-title{font-size:11px;font-weight:800;display:flex;align-items:center;gap:6px;margin-bottom:8px}.dot{width:8px;height:8px;border-radius:50%}
.chart-area{flex:1;display:flex;flex-direction:column;justify-content:center}
.bar-row{display:flex;align-items:center;gap:8px;margin:6px 0}.bar-label{width:70px;font-size:10px;font-weight:700;text-align:right}
.bar-track{flex:1;height:18px;background:#eef2e6;border-radius:999px;overflow:hidden}.bar-fill{height:100%;border-radius:999px;display:flex;align-items:center;justify-content:flex-end;padding-right:6px;color:#fff;font-size:9px;font-weight:800}
.donut-wrap{display:flex;align-items:center;gap:12px;justify-content:center;flex:1}.donut{width:90px;height:90px;border-radius:50%;position:relative}
.donut-center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:48px;height:48px;background:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800}
.legend-mini{font-size:10px;line-height:1.6}.legend-dot{width:10px;height:10px;border-radius:3px;display:inline-block}
.status{height:22px;background:#dcfce7;color:#0e5a32;font-size:10px;font-weight:700;border-radius:999px;margin:0 10px;display:flex;align-items:center;justify-content:center}
</style></head><body>
<div class="header"><div><h1>🌿 Desa Roga — Grafik 2026 [OFFLINE]</h1><p id="jam">Memuat...</p></div><div><a class="btn btn-white" href="index_beranda_desa_roga.html">← Kembali ke Beranda</a></div></div>
<div class="top">
<div class="stat"><div style="font-size:9px;font-weight:800">🏡 KK</div><div class="val" id="angkaKK">2</div><div style="font-size:9px">2 KK</div></div>
<div class="stat"><div style="font-size:9px;font-weight:800">👥 Penduduk</div><div class="val" id="angkaPenduduk">6</div><div style="font-size:9px">6 Jiwa</div></div>
<div class="stat"><div style="font-size:9px;font-weight:800">👨 Laki</div><div class="val" id="angkaLaki">3</div><div style="font-size:9px">50%</div></div>
<div class="stat"><div style="font-size:9px;font-weight:800">👩 Perempuan</div><div class="val" id="angkaPerempuan">3</div><div style="font-size:9px">50%</div></div>
<div class="stat"><div style="font-size:9px;font-weight:800">📄 Masuk-Keluar</div><div class="val" id="angkaSurat">3</div><div style="font-size:9px">1 Masuk 2 Keluar</div></div>
</div>
<div class="main">
<div class="card"><div class="card-title"><span class="dot" style="background:#1976d2"></span> Jenis Kelamin</div><div class="chart-area"><div class="donut-wrap"><div class="donut" id="donutGender" style="background:conic-gradient(#1976d2 0% 50%, #ef5350 50% 100%)"><div class="donut-center" id="donutCenterGender">6</div></div><div class="legend-mini"><div><span class="legend-dot" style="background:#1976d2"></span><span id="legLaki">Laki 3</span></div><div><span class="legend-dot" style="background:#ef5350"></span><span id="legPerempuan">Perempuan 3</span></div></div></div></div></div>
<div class="card"><div class="card-title"><span class="dot" style="background:#ef6c00"></span> Per Dusun</div><div class="chart-area" id="areaDusun"></div></div>
<div style="display:grid;grid-template-rows:1fr 1fr;gap:8px">
<div class="card"><div class="card-title"><span class="dot" style="background:#7b1fa2"></span> Golongan Usia</div><div class="chart-area" id="areaUsia"></div></div>
<div class="card"><div class="card-title"><span class="dot" style="background:#2e7d32"></span> Surat Masuk vs Keluar</div><div class="chart-area"><div class="donut-wrap"><div class="donut" id="donutSurat" style="background:conic-gradient(#1976d2 0% 33%, #2e7d32 33% 100%)"><div class="donut-center" id="donutCenterSurat">3</div></div><div class="legend-mini"><div><span class="legend-dot" style="background:#1976d2"></span><span id="legMasuk">Masuk 1</span></div><div><span class="legend-dot" style="background:#2e7d32"></span><span id="legKeluar">Keluar 2</span></div></div></div></div></div>
</div>
</div>
<div class="status" id="statusKoneksi">✅ OFFLINE READY</div>
<script>
const KEYS=["DATABASE_DESA_ROGA_UTAMA","DATABASE_JPT_100","jptdatapenduduk100","DATA_PENDUDUK_JPT","dataPenduduk","DATABASE_DESA_ROGA"];
const KEY_ARSIP="ARSIP_SURAT_DESA_ROGA_FINAL";
function getDB(){for(let k of KEYS){try{let r=localStorage.getItem(k);if(!r)continue;let j=JSON.parse(r);if(Array.isArray(j)&&j[0]?.nik)return j;if(j.anggota?.length)return j.anggota;}catch(e){}}return null;}
function getArsip(){try{return JSON.parse(localStorage.getItem(KEY_ARSIP)||"[]")}catch(e){return []}}
let demo=[{nama:"1",nik:"5308071203950001",jk:"Laki-laki",dusun:"Aegomo",ttl:"1995"},{nama:"2",nik:"5308074508980002",jk:"Perempuan",dusun:"Aegomo",ttl:"1998"},{nama:"3",nik:"5308071005000003",jk:"Laki-laki",dusun:"Kopogire RT 004",ttl:"2000"},{nama:"4",nik:"5308075502050004",jk:"Perempuan",dusun:"Kopogire RT 004",ttl:"2005"},{nama:"5",nik:"5308072009900005",jk:"Laki-laki",dusun:"Aegomo",ttl:"1990"},{nama:"6",nik:"5308074803920006",jk:"Perempuan",dusun:"Aegomo",ttl:"1992"}];
function umur(p){let t=(p.ttl||"").toString().match(/(19\d{2}|20\d{2})/);if(t)return new Date().getFullYear()-parseInt(t[1]);let nik=(p.nik||"").toString();if(nik.length>=12){let thn=parseInt(nik.substring(10,12));let yy=new Date().getFullYear()%100;let f=thn<=yy?2000+thn:1900+thn;return new Date().getFullYear()-f;}return 30;}
function render(){let list=getDB()||demo;let arsip=getArsip();let jml=list.length;let laki=0,perempuan=0;list.forEach(p=>{if((p.jk||"").toLowerCase().includes("perempuan"))perempuan++;else laki++;});document.getElementById("angkaKK").textContent=Math.ceil(jml/3);document.getElementById("angkaPenduduk").textContent=jml;document.getElementById("angkaLaki").textContent=laki;document.getElementById("angkaPerempuan").textContent=perempuan;document.getElementById("angkaSurat").textContent=arsip.length||3;let pctL=jml?Math.round(laki/jml*100):50;document.getElementById("donutGender").style.background="conic-gradient(#1976d2 0% "+pctL+"%, #ef5350 "+pctL+"% 100%)";document.getElementById("donutCenterGender").textContent=jml;document.getElementById("legLaki").textContent="Laki-laki "+laki+" ("+pctL+"%)";document.getElementById("legPerempuan").textContent="Perempuan "+perempuan+" ("+(100-pctL)+"%)";let dusun={};list.forEach(p=>{let d=(p.dusun||"Desa").substring(0,18);dusun[d]=(dusun[d]||0)+1;});let maxD=Math.max(...Object.values(dusun));let htmlD="";Object.entries(dusun).forEach(([k,v])=>{let w=Math.round(v/maxD*100);let col=k.includes("Aegomo")?"#fb8c00":k.includes("Kopogire")?"#43a047":"#1976d2";htmlD+='<div style="display:flex;align-items:center;gap:8px;margin:6px 0"><div style="width:70px;font-size:10px;font-weight:700;text-align:right">'+k+'</div><div style="flex:1;height:18px;background:#eef2e6;border-radius:999px;overflow:hidden"><div style="width:'+w+'%;background:'+col+';height:100%;display:flex;align-items:center;justify-content:flex-end;padding-right:6px;color:#fff;font-size:9px;font-weight:800">'+v+' jiwa</div></div></div>';});document.getElementById("areaDusun").innerHTML=htmlD;let kel={Balita:0,Anak:0,Remaja:0,Dewasa:0,Lansia:0};list.forEach(p=>{let u=umur(p);if(u<=4)kel.Balita++;else if(u<=12)kel.Anak++;else if(u<=17)kel.Remaja++;else if(u<=59)kel.Dewasa++;else kel.Lansia++;});let maxU=Math.max(...Object.values(kel),1);let colors=["#ffb74d","#4fc3f7","#ba68c8","#81c784","#e57373"];let labels=["Balita 0-4","Anak 5-12","Remaja 13-17","Dewasa 18-59","Lansia 60+"];let vals=[kel.Balita,kel.Anak,kel.Remaja,kel.Dewasa,kel.Lansia];let htmlU="";vals.forEach((v,i)=>{let w=Math.round(v/maxU*100);htmlU+='<div style="display:flex;align-items:center;gap:8px;margin:6px 0"><div style="width:70px;font-size:10px;font-weight:700;text-align:right">'+labels[i]+'</div><div style="flex:1;height:18px;background:#eef2e6;border-radius:999px;overflow:hidden"><div style="width:'+w+'%;background:'+colors[i]+';height:100%;display:flex;align-items:center;justify-content:flex-end;padding-right:6px;color:#fff;font-size:9px;font-weight:800">'+v+'</div></div></div>';});document.getElementById("areaUsia").innerHTML=htmlU;let masuk=0,keluar=0;if(arsip.length>0){arsip.forEach(s=>{let t=(s.jenis||s.kategori||"").toString().toLowerCase();if(t.includes("masuk"))masuk++;else keluar++;});}else{masuk=1;keluar=2;}let totalSK=masuk+keluar||3;let pctMasuk=totalSK?Math.round(masuk/totalSK*100):33;document.getElementById("donutSurat").style.background="conic-gradient(#1976d2 0% "+pctMasuk+"%, #2e7d32 "+pctMasuk+"% 100%)";document.getElementById("donutCenterSurat").textContent=totalSK;document.getElementById("legMasuk").textContent="Masuk "+masuk;document.getElementById("legKeluar").textContent="Keluar "+keluar;document.getElementById("jam").textContent=jml+" Jiwa • "+new Date().toLocaleTimeString('id-ID')+" • OFFLINE 1 LAYAR";document.getElementById("statusKoneksi").textContent=(getDB()===null?"⚠️ Demo 6 jiwa - Pindahkan ke folder beranda":"✅ OFFLINE READY - "+jml+" Jiwa - Tidak butuh internet");}
document.addEventListener("DOMContentLoaded",render);
</script></body></html>
