<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Layanan Digital Desa Roga</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial;background:#f0fdf4}
header{background:#0b3d1f;color:white;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}
.btn-login{background:gold;color:#0b3d1f;border:none;padding:8px 14px;border-radius:999px;font-weight:900;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;padding:16px}
.card{background:white;border-radius:14px;padding:14px;box-shadow:0 4px 12px rgba(0,0,0,.08);border-left:5px solid #22c55e;position:relative}
.card.private{border-left-color:#dc2626}
.card.warga-aktif{border-left-color:#3b82f6;border-left-width:7px}
.card h3{font-size:14px} .card p{font-size:11px;color:#666;margin:6px 0 10px;line-height:1.3}
.card button{width:100%;padding:11px;border:none;border-radius:8px;font-weight:800;cursor:pointer;color:white}
.b-umum{background:#0b7b40} .b-priv{background:#dc2626} .b-lock{background:#6b7280} .b-warga-aktif{background:#2563eb}
.badge{position:absolute;top:8px;right:8px;font-size:9px;padding:3px 7px;border-radius:999px;color:white;font-weight:900}
.badge-umum{background:#22c55e} .badge-priv{background:#dc2626} .badge-warga{background:#2563eb}
.info{font-size:10px;margin-top:6px;font-weight:700}
.info-umum{color:#0b7b40} .info-priv{color:#dc2626} .info-warga{color:#2563eb}
#loginBox{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;z-index:99}
.login-form{background:white;padding:24px;border-radius:16px;width:90%;max-width:360px;text-align:center}
.login-form input{width:100%;padding:12px;margin:10px 0;border:2px solid #0b7b40;border-radius:8px}
.login-form button{width:100%;padding:12px;background:#0b7b40;color:white;border:none;border-radius:8px;font-weight:900}
</style>
</head>
<body>
<header>
  <div>
    <h1>Layanan Digital Desa Roga</h1>
    <small id="statusMode" style="color:gold">Mode: WARGA</small>
  </div>
  <button class="btn-login" id="btnLogin">Login Admin</button>
</header>
<div class="grid" id="grid"></div>

<div id="loginBox">
  <div class="login-form">
    <h3>🔒 Login Admin Desa Roga</h3>
    <input type="password" id="passInput" placeholder="Password Admin">
    <button onclick="prosesLogin()">Masuk</button>
    <button onclick="tutupLogin()" style="background:#ccc;color:#333;margin-top:8px">Batal</button>
    <p id="pesanLogin" style="font-size:12px;color:red;margin-top:8px"></p>
  </div>
</div>

<script>
// ============ GANTI PASSWORD DISINI SESUKA SOBAT ============
const PASSWORD_ADMIN = "AdminRoga2026"; // GANTI INI YA SOBAT!
// ===========================================================

const kartu = [
  {j:"Jumlah KK", d:"Ringkasan KK", t:"umum"},
  {j:"Jumlah Penduduk", d:"Ringkasan penduduk", t:"umum"},
  {j:"Laki-laki", d:"Ringkasan", t:"umum"},
  {j:"Perempuan", d:"Ringkasan", t:"umum"},
  {j:"Surat Tersimpan", d:"Arsip", t:"umum"},
  {j:"Informasi Desa dan Profil", d:"Profil Desa Roga", t:"umum"},
  {j:"Data Penduduk", d:"Kelola KK & NIK (RAHASIA)", t:"private"},
  {j:"Surat-Surat Desa", d:"Buat surat & arsip (ADMIN)", t:"private"},
  // 2 KARTU KHUSUS WARGA BOLEH ISI - SUDAH SAYA BUKA AKSESNYA
  {j:"Pengajuan Surat Dari Rumah", d:"Warga bisa urus surat dari rumah, Admin proses", t:"warga_aktif"},
  {j:"Peristiwa Penduduk", d:"Lahir, mati, pindah (ADMIN)", t:"private"},
  {j:"Pengumuman dan Agenda", d:"Kelola pengumuman", t:"private"},
  {j:"Berita dan Informasi Desa", d:"Kabar kegiatan", t:"umum"},
  {j:"Laporan dan Rekap", d:"Rekap KK & penduduk (ADMIN)", t:"private"},
  {j:"Pengisian Data RT/RW/Kadus", d:"Isi data offline (ADMIN)", t:"private"},
  {j:"Inventaris Aset Desa", d:"Aset desa", t:"private"},
  {j:"Backup dan Pemulihan", d:"Backup data penting", t:"private"},
  {j:"Peta GPS Desa Roga", d:"Lokasi desa", t:"umum"},
  {j:"APBDes Desa Roga", d:"Anggaran", t:"umum"},
  {j:"Kartu SDGs Desa", d:"18 tujuan desa", t:"umum"},
  {j:"Indeks Desa Terbaru", d:"Indeks desa", t:"umum"},
  {j:"Aspirasi dan Pengaduan Warga", d:"Warga lapor masalah lapangan, pelayanan desa ke PemDes", t:"warga_aktif"},
  {j:"Kontak dan Nomor Penting", d:"Kontak aparat", t:"umum"},
  {j:"Inventaris Aset Desa", d:"Aset", t:"private"},
  {j:"Pemantauan Program dan Kegiatan Desa", d:"Program desa", t:"umum"},
  {j:"Layanan Informasi Publik / PPID", d:"Informasi publik", t:"umum"},
  {j:"Standar Pelayanan & Privasi", d:"Alur pelayanan", t:"umum"},
  {j:"Desa Wisata Roga", d:"Wisata desa", t:"umum"},
  {j:"BUMDes & UMKM Desa", d:"Usaha desa", t:"umum"},
  {j:"Direktori Fasilitas Umum", d:"Fasilitas umum", t:"umum"},
  {j:"Dokumen Publik Desa", d:"Dokumen publik", t:"umum"},
  {j:"Peminjaman Fasilitas Desa", d:"Peminjam fasilitas", t:"umum"},
];

function render(){
  const isAdmin = localStorage.getItem('isAdminRoga')==='true';
  document.getElementById('statusMode').innerText = isAdmin ? 'Mode: ADMIN DESA (Full Akses)' : 'Mode: WARGA';
  const btn = document.getElementById('btnLogin');
  btn.innerText = isAdmin ? 'Logout Admin' : 'Login Admin';
  btn.onclick = isAdmin ? logout : bukaLogin;

  const grid = document.getElementById('grid');
  grid.innerHTML='';
  kartu.forEach(k=>{
    let badge='', btnClass='', btnText='', info='';
    if(k.t==='private'){
      badge='<span class="badge badge-priv">ADMIN SAJA</span>';
      btnClass = isAdmin ? 'b-priv' : 'b-lock';
      btnText = isAdmin ? 'Buka & Kelola' : '🔒 Terkunci - Admin Saja';
      info = '<div class="info info-priv">🔒 Rahasia, hanya admin</div>';
    }else if(k.t==='warga_aktif'){
      badge='<span class="badge badge-warga">WARGA BOLEH ISI</span>';
      btnClass='b-warga-aktif';
      btnText = isAdmin ? 'Buka & Proses (Admin)' : '✍️ Buat Pengajuan / Lapor (Warga)';
      info = '<div class="info info-warga">✅ Warga bisa isi dari rumah, Admin proses</div>';
    }else{
      badge='<span class="badge badge-umum">LIHAT SAJA</span>';
      btnClass='b-umum';
      btnText = isAdmin ? 'Buka & Kelola' : '👁️ Lihat Laporan Saja';
      info = '<div class="info info-umum">👁️ Warga hanya lihat, tidak bisa edit/tambah</div>';
    }
    grid.innerHTML+=`<div class="card ${k.t==='private'?'private':''} ${k.t==='warga_aktif'?'warga-aktif':''}">${badge}<h3>${k.j}</h3><p>${k.d}</p><button class="${btnClass}" onclick="klik('${k.j}','${k.t}')">${btnText}</button>${info}</div>`;
  });
}
function klik(judul,tipe){
  const isAdmin = localStorage.getItem('isAdminRoga')==='true';
  if(tipe==='private' && !isAdmin){ bukaLogin(); return; }
  if(tipe==='warga_aktif'){
    if(isAdmin){ alert('ADMIN: Memproses '+judul+' dari warga'); }
    else{ alert('WARGA: Membuka form '+judul+'\\n\\nWarga bisa isi form disini, nanti masuk ke Admin untuk diproses.'); }
  }else if(tipe==='umum'){
    if(isAdmin){ alert('ADMIN: Kelola '+judul); }else{ alert('WARGA: Melihat laporan '+judul+' (hanya lihat, tidak bisa edit)'); }
  }else{
    alert('ADMIN: Membuka '+judul);
  }
}
function bukaLogin(){ document.getElementById('loginBox').style.display='flex'; }
function tutupLogin(){ document.getElementById('loginBox').style.display='none'; }
function prosesLogin(){
  if(document.getElementById('passInput').value===PASSWORD_ADMIN){
    localStorage.setItem('isAdminRoga','true'); tutupLogin(); render();
  }else{ document.getElementById('pesanLogin').innerText='Password salah!'; }
}
function logout(){ localStorage.removeItem('isAdminRoga'); render(); }
render();
</script>
</body>
</html>
