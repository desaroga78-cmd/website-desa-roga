<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Website Desa Roga</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Poppins,Arial;background:#0b3d1f}
.hero{
  width:100%;height:100vh;
  background:url('BANNER_WEBSITE_DESA_ROGA_BARU.jpg') center/cover no-repeat;
  display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
  padding:30px 16px;text-align:center;
  position:relative;
}
.hero::before{content:'';position:absolute;inset:0;background:linear-gradient(to top, rgba(0,0,0,0.6) 0%, transparent 60%)}
.content{position:relative;z-index:2}
.btn{
  display:inline-flex;align-items:center;gap:12px;
  background:linear-gradient(#1db35a,#0b7b40);color:white;
  padding:16px 34px;border-radius:999px;font-weight:900;
  font-size:19px;text-decoration:none;border:3px solid #ffd700;
  box-shadow:0 8px 24px rgba(0,0,0,0.4);margin-top:18px;
}
.btn span{background:white;color:#0b7b40;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:22px}
.loading{color:#fff;margin-top:14px;font-size:13px;opacity:0.9}
@media(max-width:600px){.btn{font-size:16px;padding:14px 24px}}
</style>
</head>
<body>
<div class="hero">
  <div class="content">
    <a class="btn" href="index_beranda_desa_roga.html">Masuk ke Layanan Digital Desa Roga <span>❯</span></a>
    <div class="loading">Selamat Datang di Desa Roga - Ndona Timur - Kabupaten Ende</div>
  </div>
</div>

</html>
